name: Daily Gold Price Card

on:
  schedule:
    - cron: "10 9 * * 1-6"
      timezone: "Asia/Bangkok"
  workflow_dispatch:
    inputs:
      send_to_line:
        description: "ส่งเข้า LINE หลังสร้างภาพ"
        required: true
        default: false
        type: boolean
      force_send:
        description: "ส่งซ้ำแม้วันนี้มี receipt แล้ว"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-gold-price
  cancel-in-progress: false

jobs:
  render-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Verify parser and renderer
        run: pytest

      - name: Fetch first announcement and render
        run: >-
          python -m gold_bot fetch-render
          --output generated/latest.png
          --archive-dir generated
          --data-output generated/latest.json
          --retries 5
          --retry-delay 300

      - name: Read result date
        id: result
        shell: bash
        run: |
          RESULT_DATE="$(python -c 'import json; print(json.load(open("generated/latest.json"))["date"])')"
          echo "date=$RESULT_DATE" >> "$GITHUB_OUTPUT"

      - name: Publish generated image to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/latest.png generated/latest.json "generated/${{ steps.result.outputs.date }}.png"
          if ! git diff --cached --quiet; then
            git commit -m "chore: gold price ${{ steps.result.outputs.date }}"
            git push
          fi

      - name: Resolve public image URL
        if: github.event_name == 'schedule' || inputs.send_to_line == true
        id: public_image
        env:
          CUSTOM_BASE: ${{ vars.PUBLIC_IMAGE_BASE_URL }}
        shell: bash
        run: |
          if [[ -n "$CUSTOM_BASE" ]]; then
            IMAGE_URL="${CUSTOM_BASE%/}/latest.png?run=${GITHUB_RUN_ID}"
          else
            IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/generated/latest.png?run=${GITHUB_RUN_ID}"
          fi
          echo "url=$IMAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for public image
        if: github.event_name == 'schedule' || inputs.send_to_line == true
        run: python tools/wait_for_url.py "${{ steps.public_image.outputs.url }}" --timeout 120

      - name: Send to LINE
        if: github.event_name == 'schedule' || inputs.send_to_line == true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        shell: bash
        run: |
          FORCE_FLAG=""
          if [[ "${{ inputs.force_send }}" == "true" ]]; then FORCE_FLAG="--force"; fi
          python -m gold_bot send-line \
            --data generated/latest.json \
            --image-url "${{ steps.public_image.outputs.url }}" \
            --receipt-dir state/sent \
            $FORCE_FLAG

      - name: Save delivery receipt
        if: github.event_name == 'schedule' || inputs.send_to_line == true
        shell: bash
        run: |
          git add "state/sent/${{ steps.result.outputs.date }}.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: LINE receipt ${{ steps.result.outputs.date }}"
            git push
          fi

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-price-${{ steps.result.outputs.date }}
          path: |
            generated/latest.png
            generated/latest.json
          retention-days: 30
